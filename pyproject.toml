[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replay-harness"
version = "0.1.0"
description = "Deterministic record-and-replay toolkit for event streams"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
replay = "replay_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.88",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/replay_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=replay_harness --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
